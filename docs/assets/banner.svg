<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Kointrol.AI — Predicción de radiación solar en Panamá con redes neuronales. 3er lugar, Hackathon Samsung Innovation Campus 2025">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07122b"/>
      <stop offset="0.55" stop-color="#0b2a5b"/>
      <stop offset="1" stop-color="#1428a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff8c00" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8733a"/>
      <stop offset="0.5" stop-color="#e3a86b"/>
      <stop offset="1" stop-color="#a0622e"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88ff00"/>
      <stop offset="0.3" stop-color="#ffa500"/>
      <stop offset="1" stop-color="#ff2a00"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>

  <!-- Sol -->
  <circle cx="1080" cy="150" r="230" fill="url(#glow)"/>
  <g transform="translate(1080 150)" stroke="#ffc34d" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-118" x2="0" y2="-92"/>
    <line x1="0" y1="92" x2="0" y2="118"/>
    <line x1="-118" y1="0" x2="-92" y2="0"/>
    <line x1="92" y1="0" x2="118" y2="0"/>
    <line x1="-83" y1="-83" x2="-65" y2="-65"/>
    <line x1="65" y1="65" x2="83" y2="83"/>
    <line x1="-83" y1="83" x2="-65" y2="65"/>
    <line x1="65" y1="-65" x2="83" y2="-83"/>
  </g>
  <circle cx="1080" cy="150" r="72" fill="url(#sun)"/>

  <!-- Red neuronal estilizada -->
  <g opacity="0.35" stroke="#9fc3ff" stroke-width="1.2">
    <line x1="930" y1="300" x2="1000" y2="270"/><line x1="930" y1="300" x2="1000" y2="330"/>
    <line x1="930" y1="360" x2="1000" y2="330"/><line x1="930" y1="360" x2="1000" y2="390"/>
    <line x1="1000" y1="270" x2="1070" y2="330"/><line x1="1000" y1="330" x2="1070" y2="330"/>
    <line x1="1000" y1="390" x2="1070" y2="330"/><line x1="930" y1="300" x2="1000" y2="390"/>
  </g>
  <g fill="#cfe0ff" opacity="0.6">
    <circle cx="930" cy="300" r="6"/><circle cx="930" cy="360" r="6"/>
    <circle cx="1000" cy="270" r="6"/><circle cx="1000" cy="330" r="6"/><circle cx="1000" cy="390" r="6"/>
    <circle cx="1070" cy="330" r="8" fill="#ffc34d"/>
  </g>

  <!-- Insignia del premio -->
  <g transform="translate(72 58)">
    <rect width="520" height="44" rx="22" fill="url(#bronze)"/>
    <circle cx="24" cy="22" r="14" fill="#7a4520"/>
    <text x="24" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#ffe2c2">3</text>
    <text x="50" y="29" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2b1506" letter-spacing="1.2">3ER LUGAR · HACKATHON SIC 2025 · PANAMÁ</text>
  </g>

  <!-- Título -->
  <text x="72" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">Kointrol<tspan fill="#ffc34d">.AI</tspan></text>
  <text x="74" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#dbe7ff">Predicción de radiación solar en Panamá</text>
  <text x="74" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9fb6e0">Red neuronal · Google Earth Engine en tiempo real · Mapa por corregimiento</text>

  <!-- Escala de radiación -->
  <rect x="74" y="306" width="330" height="10" rx="5" fill="url(#scale)"/>
  <text x="74" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb6e0">R² = 0.98 · 128 000 registros climáticos · 16 variables</text>

  <text x="74" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7f95c2">Samsung Innovation Campus 2025 — Módulo de Inteligencia Artificial</text>
</svg>
